<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kinza</title>
  <meta http-equiv="refresh" content="0;url=/v7/" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="canonical" href="https://kinzabev.com/" />
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, '');
      var isRoot = path === '' || path === '/' || path === '/index.html' || path === '/kinza-demo' || path === '/kinza-demo/index.html';
      if (!isRoot) {
        return;
      }
      window.location.replace(new URL('/v7/' + window.location.search + window.location.hash, window.location.href).href);
    })();
  </script>
</head>
<body>
  <p>Redirecting to Kinza v7</p>
</body>
</html>

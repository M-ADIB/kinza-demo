<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kinza — كينزا</title>
<meta name="description" content="Kinza. Designed, born and made in Saudi Arabia. Ten flavors, 70+ countries, one attitude: like no one else." />
<meta property="og:title" content="Kinza — Like no one else" />
<meta property="og:description" content="Ten flavors. 70+ countries. Designed, born and made in Saudi Arabia." />
<meta property="og:image" content="https://m-adib.github.io/kinza-demo/assets/still/still-5.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png" />
<link rel="apple-touch-icon" href="../assets/favicon-180.png" />
<meta name="theme-color" content="#0b277a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300..900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="../assets/can-cola.png" fetchpriority="high" />
<style>
  /* ---------- the system ----------
     colour: white ground, navy ink, blue for the strips, paper for product tiles. Pantone only in hero, pop, tile patterns.
     spacing: one gutter (--gap) for every grid, one side margin (--pad), two section beats (--s6 short, --s7 chapter).
     type: display (Anton) at two sizes, one 11px label, one 15px link. Nothing else.
     entry: every white chapter opens with a label row on a hairline. Colour blocks (hero, pop) are framed by a thin strip.
     motion: marquees run, cans flip, everything else fades up once when it enters the viewport. */
  :root {
    --blue: #314da0; --navy: #0b277a; --pink: #e8235a; --paper: #e9e7dc; --white: #ffffff;
    --bg: var(--navy); --ink: var(--paper);
    --rule: rgba(11, 39, 122, .14);
    --gap: 12px;
    --pad: clamp(20px, 5vw, 72px);
    --s5: 24px; --s6: clamp(48px, 6vw, 96px); --s7: clamp(80px, 9vw, 128px);
    --max: 1320px;
    --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-spring: cubic-bezier(.34, 1.45, .5, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: "Outfit", sans-serif; background: var(--white); color: var(--navy); overflow-x: clip; }
  html[lang="ar"] body { font-family: "Cairo", "Outfit", sans-serif; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .display { font-family: "Anton", "Outfit", sans-serif; text-transform: uppercase; letter-spacing: .02em; line-height: 1.02; }
  html[lang="ar"] .display { font-family: "Cairo", sans-serif; font-weight: 900; text-transform: none; letter-spacing: 0; line-height: 1.28; }
  .label { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
  html[lang="ar"] .label { font-size: 13px; }
  html[lang="ar"] *:not([lang="en"]) { letter-spacing: 0 !important; }
  .wm { display: inline-block; height: .92em; aspect-ratio: 1519 / 547; background: currentColor; vertical-align: -.1em;
        -webkit-mask: url("../assets/kinza-logo-en.png") center / contain no-repeat; mask: url("../assets/kinza-logo-en.png") center / contain no-repeat; }
  html[lang="ar"] .wm { aspect-ratio: 1528 / 648; height: 1.1em; vertical-align: -.22em;
        -webkit-mask-image: url("../assets/kinza-logo-ar.png"); mask-image: url("../assets/kinza-logo-ar.png"); }
  .in { max-width: var(--max); margin: 0 auto; }

  /* one reveal for the whole page: fade up once, staggered by --i */
  .rv { opacity: 0; translate: 0 24px; transition: opacity .7s var(--ease-out), translate .7s var(--ease-out); transition-delay: calc(var(--i, 0) * 50ms); }
  .rv.is-in { opacity: 1; translate: 0 0; }

  /* ============ HEADER ============ */
  .header { position: fixed; inset: 0 0 auto; z-index: 70; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 var(--pad); color: var(--ink); transition: color .5s, background .35s; }
  .header.is-solid { background: var(--white); color: var(--navy); box-shadow: 0 1px 0 var(--rule); height: 56px; }
  .header.is-open { background: transparent; box-shadow: none; color: var(--paper); }
  .header .wm { height: 26px; }
  .burger { position: relative; width: 44px; height: 44px; margin-inline-end: -10px; display: grid; place-items: center; }
  .burger span { position: absolute; width: 26px; height: 2px; background: currentColor; transition: translate .3s var(--ease-out), rotate .3s var(--ease-out); }
  .burger span:first-child { translate: 0 -5px; }
  .burger span:last-child { translate: 0 5px; }
  .burger[aria-expanded="true"] span:first-child { translate: 0 0; rotate: 45deg; }
  .burger[aria-expanded="true"] span:last-child { translate: 0 0; rotate: -45deg; }
  .chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; border: 1.5px solid currentColor; padding: 9px 16px; white-space: nowrap; }
  .chip--fill { background: var(--paper); color: var(--navy); border-color: var(--paper); }
  html[lang="ar"] .chip { letter-spacing: 0; font-size: 13px; }

  /* full-screen menu panel */
  .menu { position: fixed; inset: 0; z-index: 60; background: var(--navy); color: var(--paper); display: grid; grid-template-rows: 1fr auto; padding: 100px var(--pad) 36px; overflow-y: auto; visibility: hidden; opacity: 0; translate: 0 -2%; transition: opacity .4s var(--ease-out), translate .4s var(--ease-out), visibility 0s .4s; }
  .menu.is-open { visibility: visible; opacity: 1; translate: 0 0; transition-delay: 0s; }
  html.menu-open { overflow: hidden; }
  .menu__links { display: grid; gap: clamp(4px, 1.4vh, 14px); align-content: center; }
  .menu__links a { font-size: clamp(40px, 9vw, 96px); color: var(--paper); opacity: 0; translate: 0 18px; transition: opacity .5s var(--ease-out), translate .5s var(--ease-out); }
  .menu__links a:hover { opacity: .7; }
  .menu.is-open .menu__links a { opacity: 1; translate: 0 0; }
  .menu.is-open .menu__links a:nth-child(2) { transition-delay: .06s; }
  .menu.is-open .menu__links a:nth-child(3) { transition-delay: .12s; }
  .menu.is-open .menu__links a:nth-child(4) { transition-delay: .18s; }
  .menu__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 24px; border-top: 1px solid rgba(233, 231, 220, .16); }
  .menu__group { display: flex; gap: 8px; }
  .menu__social { display: flex; gap: 6px; }
  .menu__social a { display: grid; place-items: center; width: 40px; height: 40px; opacity: .85; transition: opacity .3s; }
  .menu__social a:hover { opacity: 1; }
  .menu__social svg { width: 20px; height: 20px; }

  /* ============ 1. HERO: the can alone, flipping through the flavors ============ */
  .hero { position: relative; height: 100svh; min-height: 560px; background: var(--bg); color: var(--ink); overflow: clip; display: grid; place-items: center; padding: 0 var(--pad); transition: background .55s var(--ease-out), color .55s; }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; animation: can-start 1.3s var(--ease-spring) both; }
  @keyframes can-start { from { scale: .15; opacity: 0; } to { scale: 1; opacity: 1; } }
  .stage__name { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font-size: clamp(110px, 22vw, 360px); line-height: 1; white-space: nowrap; opacity: .12; pointer-events: none; user-select: none; }
  .hero.is-out .stage__name { opacity: 0; }
  .burst { position: absolute; width: min(120vw, 700px); aspect-ratio: 1; left: 50%; top: 50%; translate: -50% -50%; pointer-events: none; }
  .burst svg { width: 100%; height: 100%; animation: slow-spin 60s linear infinite; }
  .burst.is-pop { animation: burst-pop .7s var(--ease-spring); }
  @keyframes burst-pop { 0% { transform: scale(.55); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); } }
  @keyframes slow-spin { to { transform: rotate(360deg); } }
  .tilt { position: relative; z-index: 2; animation: wobble 4.8s ease-in-out infinite; will-change: transform; }
  .hero.is-out .tilt, .hero.is-in .tilt { animation-play-state: paused; }
  @keyframes wobble { 0% { transform: rotate(-14deg) translateY(0); } 25% { transform: rotate(6deg) translateY(-18px); } 50% { transform: rotate(16deg) translateY(0); } 75% { transform: rotate(-4deg) translateY(-14px); } 100% { transform: rotate(-14deg) translateY(0); } }
  .can { height: min(62svh, 600px); width: auto; filter: drop-shadow(0 40px 50px rgba(0, 0, 0, .35)); transform: perspective(900px) rotateY(0); transition: transform .32s ease-in, opacity .32s; will-change: transform; }
  .hero.is-out .can { transform: perspective(900px) rotateY(90deg) scale(.9); opacity: .6; }
  .hero.is-in .can { animation: can-in .38s var(--ease-out) both; }
  @keyframes can-in { from { transform: perspective(900px) rotateY(-90deg) scale(.9); opacity: .6; } to { transform: perspective(900px) rotateY(0); opacity: 1; } }
  .hero__dots { position: absolute; bottom: 28px; left: 50%; translate: -50% 0; display: flex; gap: 8px; z-index: 3; }
  .hero__dots button { width: 12px; height: 12px; border-radius: 50%; background: var(--d); border: 2px solid var(--ink); opacity: .5; transition: opacity .3s, transform .3s var(--ease-spring); }
  .hero__dots button:hover, .hero__dots button[aria-current="true"] { opacity: 1; transform: scale(1.35); }
  .hero__label { position: absolute; bottom: 54px; left: 50%; translate: -50% 0; opacity: .8; z-index: 3; }

  /* ============ thin copy strips: 36px, white with blue copy, framing every colour block ============ */
  .strip { direction: ltr; overflow: clip; height: 36px; display: flex; align-items: center; border-block: 1px solid var(--rule); background: var(--white); color: var(--blue); }
  .strip__in { display: flex; gap: 34px; width: max-content; animation: strip 60s linear infinite; }
  .strip--rev .strip__in { animation-direction: reverse; }
  .strip__in span::before { content: "•"; margin-inline-end: 34px; opacity: .45; }
  .strip__in span[lang="ar"] { font-family: "Cairo", sans-serif; letter-spacing: 0; font-size: 13px; }
  @keyframes strip { to { transform: translateX(-50%); } }

  /* ============ 2. product strip: one short row of 3:2 photographs, edge to edge ============ */
  .photos { direction: ltr; overflow: clip; background: var(--white); padding: var(--s6) 0; }
  .photos__in { display: flex; gap: var(--gap); width: max-content; animation: strip 70s linear infinite; }
  .photos__in:hover { animation-play-state: paused; }
  .photos figure { flex: none; height: clamp(160px, 15vw, 220px); aspect-ratio: 16 / 9; overflow: clip; background: var(--paper); }
  .photos img { width: 100%; height: 100%; object-fit: cover; }

  /* ============ 3. pop typography: stand-in for the client's video, word only ============ */
  .pop { position: relative; height: 100svh; min-height: 560px; display: grid; place-items: center; overflow: clip; background: var(--pb, var(--pink)); color: var(--pc, var(--paper)); transition: background .5s var(--ease-out), color .5s; text-align: center; padding: 0 var(--pad); }
  .pop__word { font-size: clamp(72px, 13vw, 240px); max-width: 9ch; }
  html[lang="ar"] .pop__word { font-size: clamp(60px, 11vw, 200px); }
  .pop__word.in { animation: pop-in .6s var(--ease-out) both; }
  .pop__word.out { animation: pop-out .3s ease-in both; }
  @keyframes pop-in { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop-out { to { transform: translateY(-14px) scale(1.02); opacity: 0; } }

  /* ============ white chapters: label row on a hairline, then the grid ============ */
  .sec { background: var(--white); color: var(--navy); padding: var(--s7) var(--pad); }
  .sec__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s5); padding-bottom: var(--s5); border-bottom: 1px solid var(--rule); margin-bottom: var(--s6); }
  .sec__head .label:last-child { opacity: .55; }

  /* 4. product wall: ten cans on paper, five across, tap shows the flavor pattern */
  .wall { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); }
  .tile { position: relative; aspect-ratio: 3 / 4; min-width: 0; background: var(--paper); overflow: clip; isolation: isolate; text-align: start; }
  .tile__pat { position: absolute; inset: 0; z-index: -1; background: var(--tb); display: grid; place-items: center; opacity: 0; scale: .6; transition: opacity .4s var(--ease-out), scale .55s var(--ease-out); }
  .tile__pat svg { width: 150%; height: auto; }
  .tile[aria-pressed="true"] .tile__pat { opacity: 1; scale: 1; }
  .tile[aria-pressed="true"] .tile__pat svg { animation: slow-spin 60s linear infinite; }
  .tile img { position: absolute; inset: 0; margin: auto; height: 72%; width: auto; max-width: 80%; object-fit: contain; transition: transform .45s var(--ease-out); }
  .tile[aria-pressed="true"] img { transform: scale(1.04); }
  .tile .tile__pat img { position: static; width: 100%; height: 100%; max-width: none; object-fit: cover; transform: none; }
  .tile small { position: absolute; inset-inline-start: 16px; bottom: 14px; color: var(--navy); transition: color .3s; }
  .tile[aria-pressed="true"] small { color: var(--tc); }

  /* 5. people: six tall portraits, three across, the photography chapter */
  .people__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
  .people__grid figure { aspect-ratio: 2 / 3; overflow: clip; background: var(--paper); }
  .people__grid img { width: 100%; height: 100%; object-fit: cover; }

  /* ============ footer: white, logo, hairline, columns of links, hairline, one line ============ */
  .footer { background: var(--white); color: var(--navy); padding: 0 var(--pad) var(--s5); }
  .footer .in { border-top: 1px solid var(--rule); padding-top: var(--s6); }
  .footer__top { padding-bottom: var(--s5); border-bottom: 1px solid var(--rule); }
  .footer__top .wm { height: 32px; }
  .footer__grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--s6) var(--gap); padding: var(--s6) 0; }
  .footer__brand p { max-width: 30ch; font-size: 15px; font-weight: 600; line-height: 1.5; opacity: .8; }
  .footer h3 { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; opacity: .55; margin-bottom: 18px; }
  html[lang="ar"] .footer h3 { font-size: 13px; }
  .footer ul { list-style: none; display: grid; gap: 10px; justify-items: start; }
  .footer li a, .footer li button { font-size: 15px; font-weight: 700; transition: opacity .25s; }
  .footer li a:hover, .footer li button:hover { opacity: .6; }
  .footer li button[aria-current="true"] { opacity: .45; cursor: default; }
  .footer__bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: var(--s5); border-top: 1px solid var(--rule); font-size: 12px; font-weight: 600; opacity: .6; }

  @media (max-width: 760px) {
    .can { height: min(52svh, 440px); filter: none; }
    .burst { width: 130vw; }
    .photos__in, .strip__in { animation-duration: 90s; }
    .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile small { inset-inline-start: 12px; bottom: 10px; }
    .people__grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); scroll-padding-inline: var(--pad); }
    .people__grid::-webkit-scrollbar { display: none; }
    .people__grid figure { flex: none; width: 78vw; scroll-snap-align: start; }
    .footer__grid { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
    .photos__in, .strip__in { animation: none !important; }
    .photos, .strip { overflow-x: auto; }
    .rv { opacity: 1; translate: 0 0; }
    .pop__word { opacity: 1; }
  }
</style>
</head>
<body>

<header class="header" id="header">
  <a class="brand" href="#top" aria-label="Kinza"><span class="wm"></span></a>
  <button class="burger" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu"><span></span><span></span></button>
</header>

<!-- full-screen menu: four brand links, language + shop, social -->
<nav class="menu" id="menu" aria-label="Menu">
  <div class="menu__links" id="menuLinks"></div>
  <div class="menu__foot">
    <div class="menu__group">
      <button class="chip" id="langBtn" type="button" data-i18n="lang">العربية</button>
      <a class="chip chip--fill" href="https://www.kinzabev.com" target="_blank" rel="noopener" data-i18n="shop">Shop online</a>
    </div>
    <div class="menu__social" id="menuSocial"></div>
  </div>
</nav>

<!-- 1. hero: no copy, the can flips through the ten flavors and the background follows. placeholder for the client's video -->
<section class="hero" id="top">
  <div class="stage" aria-hidden="true">
    <div class="stage__name display" id="spinName">Cola</div>
    <div class="burst" id="burst"><svg viewBox="-100 -100 200 200"><g id="burstG"></g></svg></div>
    <div class="tilt"><img class="can" id="spinCan" src="../assets/can-cola.png" alt="" fetchpriority="high" /></div>
  </div>
  <span class="hero__label label" id="spinLabel">Cola</span>
  <nav class="hero__dots" id="dots" aria-label="Flavors"></nav>
</section>

<div class="strip" aria-hidden="true"><div class="strip__in label" id="strip1" lang="en"></div></div>

<!-- 2. product photography strip, short. placeholders until the client's group shots arrive -->
<div class="photos" id="products"><div class="photos__in" id="productsIn"></div></div>

<div class="strip strip--rev" aria-hidden="true"><div class="strip__in label" id="strip2"></div></div>

<!-- 3. pop-style brand statements. stand-in for the client's typography video, word only -->
<section class="pop" id="pop">
  <h2 class="pop__word display" id="popWord">Bold by nature</h2>
</section>

<div class="strip" aria-hidden="true"><div class="strip__in label" id="strip3" lang="en"></div></div>

<!-- 4. the product wall: ten cans on paper rectangles. tap a can and its graphic pattern fills the tile -->
<section class="sec" id="flavors">
  <div class="in">
    <div class="sec__head rv"><span class="label" data-i18n="h_flavors">Ten flavors</span><span class="label" data-i18n="fl_hint">Tap a can</span></div>
    <div class="wall" id="tiles"></div>
  </div>
</section>

<!-- 5. people: the six mood references Marina sent on 2026-09-05, until the tailor-made shoot -->
<section class="sec" id="life">
  <div class="in">
    <div class="sec__head rv"><span class="label" data-i18n="h_people">People</span><span class="label" data-i18n="h_people_r">Like no one else</span></div>
    <div class="people__grid" id="lifeIn"></div>
  </div>
</section>

<footer class="footer" id="links">
  <div class="in">
    <div class="footer__top"><span class="wm"></span></div>
    <div class="footer__grid">
      <div class="footer__brand"><p data-i18n="foot">The fastest growing Saudi beverage brand in the world.</p></div>
      <div>
        <h3 data-i18n="f_explore">Explore</h3>
        <ul id="footLinks"></ul>
      </div>
      <div>
        <h3 data-i18n="f_follow">Follow</h3>
        <ul id="footSocial"></ul>
      </div>
      <div>
        <h3 data-i18n="f_lang">Language</h3>
        <ul id="footLang">
          <li><button type="button" data-l="en">English</button></li>
          <li><button type="button" data-l="ar" lang="ar">العربية</button></li>
        </ul>
      </div>
    </div>
    <div class="footer__bottom">
      <span>© 2026 <span class="wm" style="height: 1em"></span></span>
      <span data-i18n="f_made">Designed, born and made in Saudi Arabia</span>
    </div>
  </div>
</footer>

<script>
  const T = {
    lang: { en: 'العربية', ar: 'English' }, shop: { en: 'Shop online', ar: 'تسوّق أونلاين' }, menu: { en: 'Menu', ar: 'القائمة' },
    h_flavors: { en: 'Ten flavors', ar: 'عشر نكهات' }, fl_hint: { en: 'Tap a can', ar: 'اضغط على علبة' },
    h_people: { en: 'People', ar: 'الناس' }, h_people_r: { en: 'Like no one else', ar: 'ما نشبه أحد' },
    f_cola: { en: 'Cola', ar: 'كولا' }, f_diet: { en: 'Diet Cola', ar: 'دايت كولا' }, f_lemon: { en: 'Lemon', ar: 'ليمون' },
    f_orange: { en: 'Orange', ar: 'برتقال' }, f_citrus: { en: 'Citrus', ar: 'حمضيات' }, f_lemonzero: { en: 'Lemon Zero', ar: 'ليمون بدون سكر' },
    f_blackcurrant: { en: 'Blackcurrant', ar: 'توت بري' }, f_pomegranate: { en: 'Pomegranate', ar: 'رمان' }, f_soda: { en: 'Soda Water', ar: 'مياه غازية' }, f_cocktail: { en: 'Saudi Cocktail', ar: 'كوكتيل سعودي' },
    foot: { en: 'The fastest growing Saudi beverage brand in the world.', ar: 'العلامة السعودية الأسرع نمواً في عالم المشروبات.' },
    f_explore: { en: 'Explore', ar: 'اكتشف' }, f_follow: { en: 'Follow', ar: 'تابعنا' }, f_lang: { en: 'Language', ar: 'اللغة' },
    f_made: { en: 'Designed, born and made in Saudi Arabia', ar: 'صُممت ووُلدت وصُنعت في السعودية' },
    l1: { en: 'Discover Aseer', ar: 'اكتشف عسير' }, l1s: { en: 'Where the brand comes from', ar: 'حيث بدأت العلامة' },
    l2: { en: 'Become a partner', ar: 'كن شريكاً' }, l2s: { en: 'Distributors and retailers', ar: 'للموزعين وتجار التجزئة' },
    l3: { en: 'Join the team', ar: 'انضم للفريق' }, l3s: { en: 'Careers in Saudi Arabia', ar: 'وظائف في السعودية' },
    l4: { en: 'Online store', ar: 'المتجر الإلكتروني' }, l4s: { en: 'Every flavor, delivered', ar: 'كل النكهات توصل لبابك' },
    l5: { en: 'Instagram', ar: 'إنستغرام' }, l6: { en: 'TikTok', ar: 'تيك توك' }, l7: { en: 'Snapchat', ar: 'سناب شات' }, l8: { en: 'YouTube', ar: 'يوتيوب' }, l9: { en: 'X', ar: 'X' }, l10: { en: 'Facebook', ar: 'فيسبوك' }
  };
  // id, background, ink on it, splash colours, pattern motif (from the client's Pantone sheet)
  const FL = [
    ['cola', '#0b277a', '#e9e7dc', ['#e8235a', '#e9e7dc', '#e8235a'], 'star'],
    ['diet', '#cfd2d8', '#0b277a', ['#0b277a', '#e8235a', '#ffffff'], 'star'],
    ['lemon', '#009639', '#e9e7dc', ['#ffd100', '#e9e7dc', '#ffd100'], 'slice'],
    ['orange', '#f28c00', '#e9e7dc', ['#d62e1f', '#ffd100', '#e9e7dc'], 'slice'],
    ['citrus', '#b9cc00', '#0b277a', ['#ffd100', '#1e8a45', '#ffffff'], 'slice'],
    ['lemonzero', '#1e8a45', '#e9e7dc', ['#e9e7dc', '#ffd100', '#b9cc00'], 'slice'],
    ['blackcurrant', '#5f259f', '#e9e7dc', ['#1b2a80', '#b9cc00', '#e9e7dc'], 'berries'],
    ['pomegranate', '#b6203c', '#e9e7dc', ['#ff5a3c', '#1e8a45', '#e9e7dc'], 'pome'],
    ['soda', '#1fa8dd', '#0b277a', ['#ffffff', '#0b277a', '#ffffff'], 'bubbles'],
    ['cocktail', '#d9a21b', '#0b277a', ['#d62e1f', '#1e8a45', '#ffffff'], 'star']
  ];
  const FLI = Object.fromEntries(FL.map(f => [f[0], f]));
  // pop statements: background, ink, en, ar
  const POP = [
    ['#e8235a', '#e9e7dc', 'Bold by nature', 'جريئة بطبعها'],
    ['#0b277a', '#e9e7dc', 'Made in Saudi', 'صنع في السعودية'],
    ['#b9cc00', '#0b277a', 'Refresh different', 'انتعش بطريقتك'],
    ['#5f259f', '#ffd100', '70+ countries', '+70 دولة'],
    ['#1fa8dd', '#0b277a', 'Like no one else', 'ما نشبه أحد']
  ];
  // still-life product shots from Marina's 2026-09-06 WeTransfer
  const PRODUCTS = ['still/still-1.jpg', 'still/still-2.jpg', 'still/still-3.jpg', 'still/still-4.jpg', 'still/still-5.jpg', 'still/still-6.jpg'];
  // flavors with the client's real graphic pattern (assets/pattern). The other three still use the drawn stand-in
  const PATTERN = new Set(['cola', 'blackcurrant', 'citrus', 'lemon', 'orange', 'pomegranate', 'cocktail']);
  const LIFE = ['people/people-1.jpg', 'people/people-2.jpg', 'people/people-3.jpg', 'people/people-4.jpg', 'people/people-5.jpg', 'people/people-6.jpg'];
  const COUNTRIES = ['Saudi Arabia', 'UAE', 'Kuwait', 'Bahrain', 'Qatar', 'Oman', 'Jordan', 'Iraq', 'Egypt', 'Morocco', 'Sudan', 'Yemen', 'Lebanon', 'Pakistan', 'Malaysia', 'Indonesia', 'United Kingdom', 'Germany', 'France', 'Turkey', 'Nigeria', 'Kenya', 'South Africa', 'Australia', 'Canada', 'USA', 'Brazil', 'India', 'Bangladesh', 'Sri Lanka'];
  const MESSAGES = [['Made in Saudi', 'صنع في السعودية'], ['Ten flavors', 'عشر نكهات'], ['70+ countries', '+70 دولة'], ['Ice cold or nothing', 'باردة جداً أو لا'], ['Like no one else', 'ما نشبه أحد'], ['Fastest growing Saudi brand', 'أسرع علامة سعودية نمواً']];
  const CARDS = [
    ['https://kinza.discoveraseer.com/?source=qr', 'l1'],
    ['https://kinza.jotform.com/team/kinza-partner/kinza', 'l2'],
    ['https://kinza.jotform.com/form/join-kinza-team', 'l3'],
    ['https://www.kinzabev.com', 'l4']
  ];
  const SOCIAL = [
    ['https://www.instagram.com/kinzabev', 'l5', '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/>'],
    ['https://www.tiktok.com/@kinzabev', 'l6', '<path d="M19.6 8.6a5.8 5.8 0 0 1-3.6-1.3v6.6a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .9.1v3a2.5 2.5 0 1 0 1.7 2.4V2.5h2.9a4.7 4.7 0 0 0 3.6 3.4v2.7z" fill="currentColor" stroke="none"/>'],
    ['https://www.snapchat.com/add/kinzabev', 'l7', '<path d="M12 3c3 0 5 2.2 5 5.2v2.3c.8.2 1.4-.2 1.8 0 .3.4-.4 1-1.4 1.4.5 1.8 1.9 3 3.6 3.4-.5 1-1.7 1.1-2.4 1.3-.2.6-.2 1.2-.7 1.2-.7 0-1.4-.4-2.4 0-.9.4-1.8 1.4-3.5 1.4s-2.6-1-3.5-1.4c-1-.4-1.7 0-2.4 0-.5 0-.5-.6-.7-1.2-.7-.2-1.9-.3-2.4-1.3 1.7-.4 3.1-1.6 3.6-3.4-1-.4-1.7-1-1.4-1.4.4-.2 1 .2 1.8 0V8.2C7 5.2 9 3 12 3z"/>'],
    ['https://www.youtube.com/@kinzabev', 'l8', '<rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10 9.3l5 2.7-5 2.7z" fill="currentColor" stroke="none"/>'],
    ['https://www.twitter.com/kinzabev', 'l9', '<path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.2l7.3-8.3L1 2h6.4l4.4 5.9L18.9 2z" fill="currentColor" stroke="none"/>'],
    ['https://www.facebook.com/KinzaBev/', 'l10', '<path d="M13.5 22v-8h2.7l.4-3.1h-3.1V8.9c0-.9.25-1.5 1.55-1.5h1.65V4.6c-.3-.04-1.3-.13-2.4-.13-2.4 0-4 1.45-4 4.1v2.3H7.6V14h2.7v8z" fill="currentColor" stroke="none"/>']
  ];

  let lang = 'en';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const ico = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const PETALS = matchMedia('(max-width: 760px)').matches ? 16 : 28;

  /* ---------- the one reveal ---------- */
  const rvIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); rvIO.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  const watch = () => document.querySelectorAll('.rv:not(.is-in)').forEach(el => rvIO.observe(el));

  /* ---------- burst + pattern drawing ---------- */
  function petals(cols, n, r0, r1, seed) {
    let out = '';
    for (let i = 0; i < n; i++) {
      const a = i * 360 / n + (seed || 0), len = r0 + ((i * 7 + 3) % 5) * (r1 - r0) / 4, w = 2 + (i % 3), dist = 34 + ((i * 5) % 4) * 6;
      out += `<ellipse cx="0" cy="${-(dist + len / 2)}" rx="${w}" ry="${len / 2}" fill="${cols[i % cols.length]}" transform="rotate(${a})"/>`;
      if (i % 4 === 1) out += `<circle cx="0" cy="${-(dist + len + 8)}" r="${1.4 + (i % 2)}" fill="${cols[(i + 1) % cols.length]}" transform="rotate(${a + 4})"/>`;
    }
    return out;
  }
  function motif(kind, cols) {
    const a = cols[0], b = cols[1] || cols[0], p = '#fff';
    if (kind === 'slice') return `<circle r="24" fill="${p}"/><circle r="20" fill="${a}"/>` + [0, 45, 90, 135].map(d => `<line x1="-20" y1="0" x2="20" y2="0" stroke="${p}" stroke-width="2.4" transform="rotate(${d})"/>`).join('') + `<circle r="3" fill="${p}"/>`;
    if (kind === 'berries') return `<line x1="0" y1="26" x2="0" y2="-22" stroke="${p}" stroke-width="2.5"/>` + [[0, -22, 8], [-12, -8, 8], [12, -6, 8], [-8, 8, 7], [9, 10, 7], [0, 0, 6]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${b}" stroke="${p}" stroke-width="1.5"/>`).join('');
    if (kind === 'pome') { let d = ''; for (let y = -16; y <= 16; y += 8) for (let x = -16; x <= 16; x += 8) if (x * x + y * y < 330) d += `<circle cx="${x}" cy="${y + 4}" r="2.8" fill="${a}"/>`; return `<path d="M0 -30 L10 -18 A22 22 0 1 1 -10 -18 Z" fill="${p}"/>${d}`; }
    if (kind === 'bubbles') return [[0, 0, 12], [-18, -14, 6], [16, -18, 8], [18, 12, 5], [-16, 14, 7], [4, 24, 4]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${p}" stroke-width="2.2"/>`).join('');
    let pts = ''; for (let i = 0; i < 16; i++) { const r = i % 2 ? 9 : 26, t = i * Math.PI / 8; pts += `${(r * Math.sin(t)).toFixed(1)},${(-r * Math.cos(t)).toFixed(1)} `; }
    return `<polygon points="${pts}" fill="${a}"/><circle r="5" fill="${p}"/>`;
  }
  const bigPattern = id => { if (PATTERN.has(id)) return `<img src="../assets/pattern/${id}.jpg" alt="" loading="lazy" />`; const [, , , cols, kind] = FLI[id]; return `<svg viewBox="-100 -100 200 200"><g opacity=".55">${petals(cols, 36, 30, 70, 3)}</g>${motif(kind, cols)}</svg>`; };

  /* ---------- 1. hero ---------- */
  let cur = 0, timer = null, busy = false;
  const hero = document.getElementById('top'), can = document.getElementById('spinCan'), burstG = document.getElementById('burstG'), burst = document.getElementById('burst'), dots = document.getElementById('dots');
  dots.innerHTML = FL.map(([id, bg], i) => `<button type="button" style="--d:${bg}" data-i="${i}" aria-label="${T['f_' + id].en}"></button>`).join('');
  dots.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i, true); });
  function paint(i) {
    const [id, bg, ink, cols] = FL[i];
    document.documentElement.style.setProperty('--bg', bg);
    document.documentElement.style.setProperty('--ink', ink);
    can.src = `../assets/can-${id}${lang === 'ar' ? '-ar' : ''}.png`;
    burstG.innerHTML = petals(cols, PETALS, 30, 70, 0);
    document.getElementById('spinName').textContent = T['f_' + id][lang];
    document.getElementById('spinLabel').textContent = T['f_' + id][lang];
    dots.querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
    burst.classList.remove('is-pop'); void burst.offsetWidth; burst.classList.add('is-pop');
  }
  function go(i, manual) {
    if (busy) return; busy = true;
    if (manual) schedule(7000);
    if (reduced) { cur = i; paint(i); busy = false; return; }
    hero.classList.add('is-out');
    setTimeout(() => { hero.classList.remove('is-out'); cur = i; paint(i); hero.classList.add('is-in'); setTimeout(() => hero.classList.remove('is-in'), 400); busy = false; }, 330);
  }
  function schedule(delay) { clearInterval(timer); if (reduced) return; timer = setInterval(() => go((cur + 1) % FL.length), 2600); if (delay) { clearInterval(timer); setTimeout(() => schedule(), delay); } }
  FL.forEach(([id]) => { const a = new Image(); a.src = `../assets/can-${id}.png`; });
  paint(0); schedule();
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : schedule());

  /* ---------- header + menu panel ---------- */
  (function () {
    const h = document.getElementById('header'), menu = document.getElementById('menu'), btn = document.getElementById('menuBtn');
    const f = () => h.classList.toggle('is-solid', scrollY > 40); addEventListener('scroll', f, { passive: true }); f();
    document.getElementById('menuLinks').innerHTML = CARDS.map(([href, k]) => `<a class="display" href="${href}" target="_blank" rel="noopener" data-i18n="${k}">${T[k].en}</a>`).join('');
    document.getElementById('menuSocial').innerHTML = SOCIAL.map(([href, k, d]) => `<a href="${href}" target="_blank" rel="noopener" aria-label="${T[k].en}">${ico(d)}</a>`).join('');
    function setMenu(open) {
      menu.classList.toggle('is-open', open); h.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', String(open)); document.documentElement.classList.toggle('menu-open', open);
      (open ? menu.querySelector('a') : btn).focus({ preventScroll: true });
    }
    btn.addEventListener('click', () => setMenu(!menu.classList.contains('is-open')));
    menu.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('is-open')) setMenu(false); });
  })();

  /* ---------- strips ---------- */
  function buildStrips() {
    const msgs = MESSAGES.map(m => `<span${lang === 'ar' ? ' lang="ar"' : ''}>${esc(lang === 'ar' ? m[1] : m[0])}</span>`).join('');
    const countries = COUNTRIES.map(c => `<span lang="en">${esc(c)}</span>`).join('');
    document.getElementById('strip1').innerHTML = countries.repeat(2);
    document.getElementById('strip2').innerHTML = msgs.repeat(4);
    document.getElementById('strip3').innerHTML = countries.repeat(2);
  }
  const fig = (src, i) => `<figure${i == null ? '' : ` class="rv" style="--i:${i}"`}><img src="../assets/${encodeURI(src)}" alt="" loading="lazy" /></figure>`;
  document.getElementById('productsIn').innerHTML = PRODUCTS.map(s => fig(s)).join('').repeat(3);
  document.getElementById('lifeIn').innerHTML = LIFE.map(fig).join('');

  /* ---------- 3. pop statements, cycling while on screen. the client's video replaces this ---------- */
  (function () {
    const sec = document.getElementById('pop'), word = document.getElementById('popWord');
    let i = 0, t = null;
    function show(k) {
      const [bg, ink, en, ar] = POP[k];
      sec.style.setProperty('--pb', bg); sec.style.setProperty('--pc', ink);
      word.textContent = lang === 'ar' ? ar : en;
      word.classList.remove('out'); word.classList.remove('in'); void word.offsetWidth; word.classList.add('in');
    }
    function next() { if (reduced) { i = (i + 1) % POP.length; show(i); return; } word.classList.add('out'); setTimeout(() => { i = (i + 1) % POP.length; show(i); }, 300); }
    show(0);
    new IntersectionObserver(es => es.forEach(e => { clearInterval(t); if (e.isIntersecting) t = setInterval(next, 1600); }), { threshold: .4 }).observe(sec);
    sec.addEventListener('click', next);
    window.popRefresh = () => show(i);
  })();

  /* ---------- 4. product wall ---------- */
  const tiles = document.getElementById('tiles');
  const on = new Set(); // tiles showing their pattern, kept across a language switch
  function buildTiles() {
    tiles.innerHTML = FL.map(([id, bg, ink], i) => `<button type="button" class="tile rv" data-id="${id}" aria-pressed="${on.has(id)}" style="--i:${i % 5};--tb:${bg};--tc:${ink}" aria-label="${esc(T['f_' + id][lang])}"><div class="tile__pat" aria-hidden="true">${bigPattern(id)}</div><img src="../assets/can-${id}${lang === 'ar' ? '-ar' : ''}.png" alt="" loading="lazy" /><small class="label">${esc(T['f_' + id][lang])}</small></button>`).join('');
    watch();
  }
  tiles.addEventListener('click', e => { const b = e.target.closest('.tile'); if (!b) return; const id = b.dataset.id; on.has(id) ? on.delete(id) : on.add(id); b.setAttribute('aria-pressed', String(on.has(id))); });

  /* ---------- footer, language ---------- */
  document.getElementById('footLinks').innerHTML = CARDS.map(([href, k]) => `<li><a href="${href}" target="_blank" rel="noopener" data-i18n="${k}">${T[k].en}</a></li>`).join('');
  document.getElementById('footSocial').innerHTML = SOCIAL.map(([href, k]) => `<li><a href="${href}" target="_blank" rel="noopener" data-i18n="${k}">${T[k].en}</a></li>`).join('');
  function applyLang(next) {
    lang = next;
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { const t = T[el.dataset.i18n]; if (t) el.textContent = t[lang]; });
    document.getElementById('menuBtn').setAttribute('aria-label', T.menu[lang]);
    document.querySelectorAll('#footLang button').forEach(b => b.setAttribute('aria-current', String(b.dataset.l === lang)));
    buildStrips(); buildTiles(); paint(cur); window.popRefresh();
    try { localStorage.setItem('kinza-lang', lang); } catch (_) {}
  }
  (function () {
    const q = new URLSearchParams(location.search).get('lang');
    let saved = null; try { saved = localStorage.getItem('kinza-lang'); } catch (_) {}
    applyLang(q === 'ar' || q === 'en' ? q : (saved === 'ar' ? 'ar' : 'en'));
    document.getElementById('langBtn').addEventListener('click', () => applyLang(lang === 'ar' ? 'en' : 'ar'));
    document.getElementById('footLang').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.l !== lang) applyLang(b.dataset.l); });
    watch();
  })();
</script>
</body>

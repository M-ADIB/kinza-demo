<style>
  /* ---------- the system ----------
     colour: white ground, navy ink, blue for the strips, paper for product tiles. Pantone only in hero, pop, tile patterns.
     spacing: one gutter (--gap) for every grid, one side margin (--pad), two section beats (--s6 short, --s7 chapter).
     type: display (Anton) at two sizes, one 11px label, one 15px link. Nothing else.
     entry: every white chapter opens with a label row on a hairline. Colour blocks (hero, pop) are framed by a thin strip.
     motion: marquees run, cans flip, everything else fades up once when it enters the viewport. */
  :root {
    --blue: #314da0; --navy: #001489; --pink: #e8235a; --paper: #e9e7dc; --white: #ffffff;
    --grey: #ededed; /* the ground under Marina's own can renders */
    --bg: var(--navy); --ink: var(--white);
    --rule: rgba(0, 20, 137, .14);
    --gap: 12px;
    --pad: clamp(20px, 5vw, 72px);
    --s5: 24px; --s6: clamp(48px, 6vw, 96px); --s7: clamp(80px, 9vw, 128px);
    --max: 1320px;
    --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-spring: cubic-bezier(.34, 1.45, .5, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: "Outfit", sans-serif; background: var(--white); color: var(--navy); overflow-x: clip; }
  html[lang="ar"] body { font-family: "Cairo", "Outfit", sans-serif; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .display { font-family: "Anton", "Outfit", sans-serif; text-transform: uppercase; letter-spacing: .02em; line-height: 1.02; }
  html[lang="ar"] .display { font-family: "Cairo", sans-serif; font-weight: 900; text-transform: none; letter-spacing: 0; line-height: 1.28; }
  .label { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
  html[lang="ar"] .label { font-size: 13px; }
  html[lang="ar"] *:not([lang="en"]) { letter-spacing: 0 !important; }
  .wm { display: inline-block; height: .92em; aspect-ratio: 1519 / 547; background: currentColor; vertical-align: -.1em;
        -webkit-mask: url("../assets/brand/logos/kinza-logo-en.png") center / contain no-repeat; mask: url("../assets/brand/logos/kinza-logo-en.png") center / contain no-repeat; }
  html[lang="ar"] .wm { aspect-ratio: 1528 / 648; height: 1.1em; vertical-align: -.22em;
        -webkit-mask-image: url("../assets/brand/logos/kinza-logo-ar.png"); mask-image: url("../assets/brand/logos/kinza-logo-ar.png"); }
  .in { max-width: var(--max); margin: 0 auto; }

  /* one reveal for the whole page: static content only, fades up and settles once */
  .rv { opacity: 0; translate: 0 24px; scale: .96; transition: opacity .9s var(--ease-out), translate .9s var(--ease-out), scale .9s var(--ease-out); transition-delay: calc(var(--i, 0) * 60ms); }
  .rv.is-in { opacity: 1; translate: 0 0; scale: 1; }

  /* ============ HEADER ============ */
  .header { position: fixed; inset: 0 0 auto; z-index: 70; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 var(--pad); color: var(--ink); transition: color .5s, background .35s; }
  .header.is-solid { background: var(--white); color: var(--navy); box-shadow: 0 1px 0 var(--rule); }
  .header.is-open { background: var(--navy); box-shadow: none; color: var(--white); }
  .header .wm { height: 26px; }
  .burger { position: relative; width: 44px; height: 44px; margin-inline-end: -10px; display: grid; place-items: center; }
  .burger span { position: absolute; width: 26px; height: 2px; background: currentColor; transition: translate .3s var(--ease-out), rotate .3s var(--ease-out); }
  .burger span:first-child { translate: 0 -5px; }
  .burger span:last-child { translate: 0 5px; }
  .burger[aria-expanded="true"] span:first-child { translate: 0 0; rotate: 45deg; }
  .burger[aria-expanded="true"] span:last-child { translate: 0 0; rotate: -45deg; }
  .chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; border: 1.5px solid currentColor; padding: 9px 16px; white-space: nowrap; }
  .chip--fill { background: var(--paper); color: var(--navy); border-color: var(--paper); }
  html[lang="ar"] .chip { letter-spacing: 0; font-size: 13px; }

  /* full-screen menu panel */
  .menu { position: fixed; inset: 0; z-index: 60; background: var(--navy); color: var(--white); display: grid; grid-template-rows: 1fr auto; padding: 100px var(--pad) 36px; overflow-y: auto; visibility: hidden; opacity: 0; translate: 0 -2%; transition: opacity .4s var(--ease-out), translate .4s var(--ease-out), visibility 0s .4s; }
  .menu.is-open { visibility: visible; opacity: 1; translate: 0 0; transition-delay: 0s; }
  html.menu-open { overflow: hidden; }
  .menu__links { display: grid; gap: clamp(4px, 1.4vh, 14px); align-content: center; }
  .menu__links a { font-size: clamp(40px, 9vw, 96px); color: var(--white); opacity: 0; translate: 0 18px; transition: opacity .5s var(--ease-out), translate .5s var(--ease-out); }
  .menu__links a:hover { opacity: .7; }
  .menu.is-open .menu__links a { opacity: 1; translate: 0 0; }
  .menu.is-open .menu__links a:nth-child(2) { transition-delay: .06s; }
  .menu.is-open .menu__links a:nth-child(3) { transition-delay: .12s; }
  .menu.is-open .menu__links a:nth-child(4) { transition-delay: .18s; }
  .menu__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 24px; border-top: 1px solid rgba(233, 231, 220, .16); }
  .menu__group { display: flex; gap: 8px; }
  .menu__social { display: flex; gap: 6px; }
  .menu__social a { display: grid; place-items: center; width: 40px; height: 40px; opacity: .85; transition: opacity .3s; }
  .menu__social a:hover { opacity: 1; }
  .menu__social svg { width: 20px; height: 20px; }

  /* ============ 1. HERO: one can turning, the flavor morphs under it, no copy ============
     the clips are Ahmad's 360 renders laid on the flavor's own colour, so the frame edge is the
     hero ground. the outer 40px of every clip is that flat colour, and the mask feathers it away. */
  .hero { position: relative; height: 100svh; min-height: 560px; background: var(--bg); color: var(--ink); overflow: clip; display: grid; place-items: center; padding: 0 var(--pad); transition: background .55s var(--ease-out), color .55s; }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; animation: can-start 1.1s var(--ease-out) both; }
  @keyframes can-start { from { scale: .94; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes slow-spin { to { transform: rotate(360deg); } }
  .spin { position: relative; height: min(82svh, 760px); aspect-ratio: 824 / 1094; }
  .spin > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .45s linear;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 15%, #000 85%, transparent 100%), linear-gradient(180deg, transparent 0, #000 10%, #000 90%, transparent 100%);
        -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 15%, #000 85%, transparent 100%), linear-gradient(180deg, transparent 0, #000 10%, #000 90%, transparent 100%); mask-composite: intersect; }
  .spin > .is-on { opacity: 1; }
  /* the reduced-motion still is the bare can, so it takes no mask and matches the clip's can height */
  .spin > img { -webkit-mask-image: none; mask-image: none; height: 80%; width: auto; inset: 0; margin: auto; }
  /* the client's own can-flip film drops in here: give it class="spin__film" and it covers the stack */
  .spin:has(.spin__film) { width: 100%; height: 100%; aspect-ratio: auto; }
  .hero:has(.spin__film) { padding: 0; }
  .spin > .spin__film { opacity: 1; z-index: 2; object-fit: cover; -webkit-mask-image: none; mask-image: none; }
  .hero:has(.spin__film) .hero__dots { display: none; }
  .curtain { position: absolute; inset: 0; background: var(--navy); opacity: 0; pointer-events: none; z-index: 4; }
  .hero__dots { position: absolute; bottom: 28px; left: 50%; translate: -50% 0; display: flex; gap: 8px; z-index: 5; }
  .hero__dots button { width: 12px; height: 12px; border-radius: 50%; background: var(--d); border: 2px solid var(--ink); opacity: .5; transition: opacity .3s, transform .3s var(--ease-spring); }
  .hero__dots button:hover, .hero__dots button[aria-current="true"] { opacity: 1; transform: scale(1.35); }

  /* ============ thin copy strips: 36px, white with blue copy, framing every colour block ============ */
  .strip { direction: ltr; overflow: clip; height: 36px; display: flex; align-items: center; border-block: 1px solid var(--rule); background: var(--white); color: var(--blue); }
  .strip__in { display: flex; gap: 34px; width: max-content; animation: strip 60s linear infinite; }
  .strip--rev .strip__in { animation-direction: reverse; }
  .strip__in span::before { content: "•"; margin-inline-end: 34px; opacity: .45; }
  .strip__in span[lang="ar"] { font-family: "Cairo", sans-serif; letter-spacing: 0; font-size: 13px; }
  @keyframes strip { to { transform: translateX(-50%); } }

  /* ============ 2. still life: a tall band sitting straight on both tickers, no white gap ============ */
  .photos { direction: ltr; overflow: hidden; touch-action: pan-y; scrollbar-width: none; cursor: grab; overscroll-behavior-x: contain; background: var(--white); padding: 0; }
  .photos__in { display: flex; width: max-content; will-change: transform; }
  .photos::-webkit-scrollbar { display: none; }
  .photos img { -webkit-user-drag: none; user-select: none; }
  .photos figure { flex: none; height: 100svh; min-height: 520px; aspect-ratio: 4 / 3; margin-inline-end: var(--gap); overflow: clip; background: var(--paper); }
  .photos img { width: 100%; height: 100%; object-fit: cover; }

  /* ============ 3. pop typography: stand-in for the client's video, word only ============ */
  .pop { position: relative; height: 100svh; min-height: 560px; display: grid; place-items: center; overflow: clip; background: var(--pb, var(--pink)); color: var(--pc, var(--paper)); transition: background .5s var(--ease-out), color .5s; text-align: center; padding: 0 var(--pad); }
  .pop__word { font-size: clamp(48px, 13vw, 240px); max-width: 11ch; }
  .pop__word.in { animation: pop-in .6s var(--ease-out) both; }
  .pop__word.out { animation: pop-out .3s ease-in both; }
  /* the client's typography film drops in here: give the video id="popFilm" and it covers the word */
  .pop__film { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
  @keyframes pop-in { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop-out { to { transform: translateY(-14px) scale(1.02); opacity: 0; } }

  /* ============ white chapters: each one fills the screen, content centred ============ */
  /* a max-content child (the sliding rows) would blow the track open, so the track is pinned */
  .sec { background: var(--white); color: var(--navy); padding: 0 var(--pad); min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; }

  /* 4. can strip: ten cans on paper rectangles sliding right to left, tap shows the flavor pattern (Marina, 2026-09-07 13:52) */
  .sec--flavors { padding: 0; min-height: 0; background: var(--grey); }
  .cans { direction: ltr; overflow: hidden; touch-action: pan-y; overscroll-behavior-x: contain; scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .cans::-webkit-scrollbar { display: none; }
  .cans.is-drag { cursor: grabbing; }
  .cans__in { display: flex; width: max-content; will-change: transform; }
  .tile img { -webkit-user-drag: none; }
  .tile { position: relative; flex: none; height: 100svh; min-height: 520px; width: max(34vw, 52svh); margin-inline-end: var(--gap); background: linear-gradient(180deg, #f5f5f5, #e4e4e4); overflow: clip; isolation: isolate; }
  .tile__pat { position: absolute; inset: 0; z-index: -1; background: var(--tb); display: grid; place-items: center; opacity: 0; scale: .6; transition: opacity .4s var(--ease-out), scale .55s var(--ease-out); }
  .tile__pat svg { width: 150%; height: auto; }
  .tile[aria-pressed="true"] .tile__pat { opacity: 1; scale: 1; }
  @media (hover: hover) { .tile:hover .tile__pat { opacity: 1; scale: 1; } .tile:hover img { transform: scale(1.04); } }
  .tile[aria-pressed="true"] .tile__pat svg { animation: slow-spin 60s linear infinite; }
  .tile img { position: absolute; inset: 0; margin: auto; height: 108%; width: 100%; max-width: none; object-fit: contain; transition: transform .45s var(--ease-out); }
  .tile[aria-pressed="true"] img { transform: scale(1.04); }
  .tile .tile__pat img { position: static; width: 100%; height: 100%; max-width: none; object-fit: cover; transform: none; }

  /* 5. the pattern wall: complete portrait artwork, straight from the brand deck */
  .grid9 { background: var(--white); }
  .grid9__in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
  .grid9 figure { overflow: clip; background: var(--paper); }
  .grid9 img { width: 100%; height: auto; }

  /* 6. people: three columns of tall portraits sliding past each other, after yoyoyo's grid */
  .sec--people { padding: 0; min-height: 0; }
  .wall { direction: ltr; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); height: 100svh; min-height: 520px; overflow: clip; align-items: start; }
  .wall__col { will-change: transform; }
  /* Each column travels only as far as its last portrait. */
  .wall figure { aspect-ratio: 635 / 790; margin-bottom: var(--gap); overflow: clip; background: var(--paper); }
  .wall figure:last-child { margin-bottom: 0; }
  .wall img { width: 100%; height: 100%; object-fit: cover; }

  /* The closing claim, with Saudi as the visual centre. */
  .say { background: var(--white); color: var(--blue); padding: clamp(56px, 7vw, 100px) var(--pad); min-height: 100svh; display: grid; place-items: center; text-align: center; }
  .say h2 { width: 100%; }
  .say__intro { display: block; font-size: clamp(28px, 4.2vw, 64px); }
  .say__hero { display: block; font-size: clamp(100px, 24vw, 360px); margin-block: 12px; }
  .say__end { display: block; font-size: clamp(36px, 7vw, 108px); }
  html[lang="ar"] .say__intro { font-size: clamp(24px, 3.8vw, 56px); }
  html[lang="ar"] .say__hero { font-size: clamp(64px, 15vw, 224px); }
  html[lang="ar"] .say__end { font-size: clamp(30px, 5.6vw, 84px); }


  /* Global presence: primary brand colours, with geography reused from V1. */
  .reach { background: var(--navy); color: var(--white); padding: clamp(48px, 6vw, 88px) clamp(20px, 5vw, 72px) 32px; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; overflow: clip; }
  .reach__head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 32px; }
  .reach__from { display: block; font-family: Outfit, sans-serif; font-size: clamp(20px, 2.2vw, 32px); line-height: 1.3; letter-spacing: .02em; font-weight: 600; margin-bottom: 14px; }
  .reach__title { font-size: clamp(56px, 7.6vw, 112px); font-weight: 400; }
  .reach__title > span:last-child { display: block; }
  .reach__stat { padding-inline-start: clamp(24px, 4vw, 64px); border-inline-start: 1px solid rgba(255,255,255,.3); }
  .reach__number { display: block; font-family: Anton, sans-serif; font-size: clamp(120px, 14.5vw, 216px); font-weight: 400; line-height: 1; letter-spacing: -.03em; direction: ltr; }
  .reach__countries { display: block; font-size: clamp(16px, 1.4vw, 20px); font-weight: 600; margin-top: 12px; }
  .reach__map { position: relative; direction: ltr; width: 100%; max-width: 1320px; margin: 30px auto 10px; }
  .reach__map svg { display: block; width: 100%; height: auto; overflow: visible; }
  .reach__land { fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; opacity: .32; }
  .reach__routes { fill: currentColor; }
  .reach__route { fill: none; stroke: currentColor; stroke-width: 1.15; opacity: .75; }
  .reach__origin { fill: var(--navy); stroke: currentColor; stroke-width: 2; }
  .reach__origin-core { fill: currentColor; }
  .reach__origin-label { position: absolute; left: 61.87%; top: 43.17%; transform: translate(-50%, calc(-100% - 26px)); background: var(--navy); padding: 5px 9px; font-size: clamp(10px, 1vw, 14px); font-weight: 700; white-space: nowrap; }
  .reach__note { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.3); font-size: 16px; line-height: 1.5; }
  .reach__note .wm { flex: none; width: 92px; height: auto; }
  html[lang="ar"] .reach__from { font-family: Cairo, sans-serif; line-height: 1.5; letter-spacing: 0; }
  html[lang="ar"] .reach__title { font-size: clamp(48px, 6.6vw, 96px); }
  html[lang="ar"] .reach__number { font-family: Anton, sans-serif; }
  html[lang="ar"] .reach__note .wm { height: auto; }
  @media (prefers-reduced-motion: no-preference) {
    .reach.is-in .reach__route { animation: reach-route 1.7s var(--ease-out, ease-out) both; animation-delay: calc(var(--route) * 65ms); }
    @keyframes reach-route { from { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; } to { stroke-dasharray: 1; stroke-dashoffset: 0; opacity: .75; } }
  }
  @media (max-width: 656px) {
    .reach { min-height: 0; padding-top: 48px; padding-bottom: 28px; }
    .reach__head { grid-template-columns: minmax(0, 1fr); gap: 32px; }
    .reach__title { font-size: clamp(48px, 13vw, 82px); }
    .reach__from { font-size: 18px; margin-bottom: 10px; }
    .reach__stat { display: flex; align-items: center; gap: 24px; padding-inline-start: 0; border: 0; }
    .reach__number { font-size: clamp(116px, 33vw, 180px); }
    .reach__countries { font-size: 18px; max-width: 8em; margin: 0; line-height: 1.4; }
    .reach__map { margin-block: 24px; }
    .reach__land { stroke-width: 4; opacity: .42; }
    .reach__route { stroke-width: 1.8; }
    .reach__origin-label { transform: translate(-50%, calc(-100% - 12px)); font-size: 10px; padding: 3px 5px; }
    .reach__note { align-items: flex-end; font-size: 14px; gap: 20px; padding-top: 20px; }
    .reach__note .wm { width: 72px; }
    html[lang="ar"] .reach__title { font-size: clamp(44px, 12vw, 72px); }
  }

  /* One blue footer, using the menu's white type and icons. */
  .footer { background: var(--navy); color: var(--white); padding-top: var(--s6); }
  .footer .in { padding-inline: var(--pad); max-width: none; }
  .footer__grid { display: grid; grid-template-columns: 3fr 1fr; gap: var(--s6) var(--gap); padding-bottom: var(--s6); }
  .footer h3 { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; opacity: .65; margin-bottom: 24px; }
  html[lang="ar"] .footer h3 { font-size: 13px; }
  .footer ul { list-style: none; display: grid; gap: 12px; justify-items: start; }
  .footer li a { font-family: "Anton", sans-serif; font-size: clamp(28px, 4.5vw, 68px); text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; }
  html[lang="ar"] .footer li a { font-family: "Cairo", sans-serif; font-weight: 900; line-height: 1.28; }
  .footer li button { font-size: 16px; font-weight: 700; padding-block: 6px; }
  .footer li a:hover, .footer li button:hover { opacity: .65; }
  .footer li button[aria-current="true"] { text-decoration: underline; text-underline-offset: 5px; cursor: default; }
  .footer__social { display: flex; justify-content: flex-start; gap: 12px; color: var(--white); padding: 0 var(--pad) 32px; }
  .footer__social a { display: grid; place-items: center; width: 44px; height: 44px; transition: opacity .25s, scale .25s var(--ease-out); }
  .footer__social a:hover { opacity: .7; scale: 1.1; }
  .footer__social svg { width: 24px; height: 24px; }
  .footer__bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 24px; border-top: 1px solid rgba(255,255,255,.2); font-size: 12px; font-weight: 600; opacity: .7; }

  @media (max-width: 656px) {
    .spin { height: min(60svh, 500px); }
    .strip__in { animation-duration: 90s; }
    .photos figure { height: 364px; min-height: 0; aspect-ratio: 4 / 5; }
    .wall { padding-inline: 0; height: 100svh; }
    .sec { min-height: 0; padding: 0; }
    .say { min-height: 0; padding-block: var(--s7); }
    .tile { height: 364px; min-height: 0; width: 64vw; }
    .footer__grid { grid-template-columns: 1fr; gap: 36px; }

  }
  tiles.addEventListener('click', e => {
    const b = e.target.closest('.tile'); if (!b || canMotion.wasDragged()) return;
    const id = b.dataset.id; on.has(id) ? on.delete(id) : on.add(id);
    b.setAttribute('aria-pressed', String(on.has(id)));
  });

  (function peopleMotion() {
    const wall = document.getElementById('lifeIn'), phone = matchMedia('(max-width: 656px)');
    let animations = [], timer, visible = false, forward = true, progress = 0;
    function stop() {
      clearTimeout(timer);
      const first = wall.firstElementChild, distance = first ? Math.max(0, first.offsetHeight-wall.clientHeight) : 0;
      if (distance) progress = Math.max(0, Math.min(1, -new DOMMatrixReadOnly(getComputedStyle(first).transform).m42 / distance));
      animations.forEach(a => a.cancel()); animations = [];
      draw();
    }
    function draw() {
      [...wall.children].forEach((col, i) => {
        const distance = Math.max(0, col.offsetHeight-wall.clientHeight);
        col.style.transform = `translate3d(0,${-distance*(i === 1 ? 1-progress : progress)}px,0)`;
      });
    }
    function run() {
      if (reduced || !visible || document.hidden || animations.length) return;
      clearTimeout(timer);
      const cols = [...wall.children], distance = Math.max(0, cols[0].offsetHeight-wall.clientHeight);
      if (!distance) return;
      const target = forward ? 1 : 0;
      if (Math.abs(target-progress)*distance < 5) { forward = !forward; timer = setTimeout(run, 1000); return; }
      const fullDuration = Math.max(2800, Math.max(...cols.map(c => c.children.length))*2700/7);
      const duration = Math.max(1000, fullDuration*Math.abs(target-progress));
      animations = cols.map((col, i) => {
        const travel = Math.max(0, col.offsetHeight-wall.clientHeight);
        return col.animate([
          { transform: `translate3d(0,${-travel*(i === 1 ? 1-progress : progress)}px,0)` },
          { transform: `translate3d(0,${-travel*(i === 1 ? 1-target : target)}px,0)` }
        ], { duration, easing: galleryEase, fill: 'forwards' });
      });
      animations[0].onfinish = () => {
        progress = target; animations.forEach(a => a.cancel()); animations = []; draw(); run();
      };
    }
    function build() {
      stop();
      const count = phone.matches ? 2 : 3;
      wall.style.gridTemplateColumns = `repeat(${count}, minmax(0, 1fr))`;
      wall.innerHTML = Array.from({ length: count }, (_, c) => `<div class="wall__col">${LIFE.filter((_, i) => i % count === c).map(fig).join('')}</div>`).join('');
      draw(); run();
    }
    build(); phone.addEventListener('change', build);
    new ResizeObserver(() => { stop(); draw(); run(); }).observe(wall);
    observeGallery(wall, active => {
      visible = active;
      if (active) { wall.querySelectorAll('img').forEach(img => { img.loading = 'eager'; }); run(); }
      else stop();
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : run());
  })();

  /* ---------- footer, language ---------- */
  document.getElementById('footLinks').innerHTML = CARDS.map(([href, k]) => `<li><a href="${href}" target="_blank" rel="noopener" data-i18n="${k}">${T[k].en}</a></li>`).join('');
  document.getElementById('footSocial').innerHTML = SOCIAL.map(([href, k, d]) => `<a href="${href}" target="_blank" rel="noopener" aria-label="${T[k].en}">${ico(d)}</a>`).join('');
  function applyLang(next) {
    lang = next;
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { const t = T[el.dataset.i18n]; if (t) el.textContent = t[lang]; });
    document.getElementById('menuBtn').setAttribute('aria-label', T.menu[lang]);
    document.querySelectorAll('#footLang button').forEach(b => b.setAttribute('aria-current', String(b.dataset.l === lang)));
    const lines = lang === 'ar' ? ['العلامة', 'السعودية', 'الأسرع نمواً في عالم المشروبات'] : ['The fastest growing', 'Saudi', 'beverage brand<br>in the world'];
    document.getElementById('statement').innerHTML = `<span class="say__intro">${lines[0]}</span> <span class="say__hero">${lines[1]}</span> <span class="say__end">${lines[2]}</span>`;
    buildStrips(); buildTiles(); window.popRefresh();
    if (reduced) { spin.innerHTML = ''; Object.keys(clips).forEach(k => delete clips[k]); }
    go(cur);
    try { localStorage.setItem('kinza-lang', lang); } catch (_) {}
  }
  (function () {
    const q = new URLSearchParams(location.search).get('lang');
    let saved = null; try { saved = localStorage.getItem('kinza-lang'); } catch (_) {}
    applyLang(q === 'ar' || q === 'en' ? q : (saved === 'ar' ? 'ar' : 'en'));
    document.getElementById('langBtn').addEventListener('click', () => applyLang(lang === 'ar' ? 'en' : 'ar'));
    document.getElementById('footLang').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.l !== lang) applyLang(b.dataset.l); });
    watch();
  })();
</script>
</body>

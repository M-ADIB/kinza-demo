<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kinza — كينزا</title>
<meta name="description" content="Kinza. Designed, born and made in Saudi Arabia. Ten flavors, 70+ countries, one attitude: like no one else." />
<meta property="og:title" content="Kinza — Like no one else" />
<meta property="og:description" content="Ten flavors. 70+ countries. Designed, born and made in Saudi Arabia." />
<meta property="og:image" content="https://m-adib.github.io/kinza-demo/assets/still/still-5.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png" />
<link rel="apple-touch-icon" href="../assets/favicon-180.png" />
<meta name="theme-color" content="#001489" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300..900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --navy:#001489;
  --blue:#314da0;
  --white:#fff;
  --grey:#ededed;
  --gap:6px;
  --pad:24px;
  --bg:#001489;
  --ink:#fff;
  --ease:cubic-bezier(.2,0,.05,1)
}
* {
  box-sizing:border-box;
  margin:0;
  padding:0
}
html {
  scroll-behavior:smooth;
  scroll-padding-top:72px
}
body {
  font-family:Outfit,sans-serif;
  color:var(--navy);
  background:var(--white);
  overflow-x:clip
}
a {
  color:inherit;
  text-decoration:none
}
button {
  font:inherit;
  color:inherit;
  border:0;
  background:none;
  cursor:pointer
}
img {
  display:block;
  max-width:100%
}
button,a {
  -webkit-tap-highlight-color:transparent
}
button:focus-visible,a:focus-visible {
  outline:3px solid currentColor;
  outline-offset:-5px
}
.display {
  font-family:Anton,sans-serif;
  text-transform:uppercase;
  line-height:1.02;
  letter-spacing:.02em;
  font-weight:400
}
html[lang=ar] body {
  font-family:Cairo,sans-serif
}
html[lang=ar] .display {
  font-family:Cairo,sans-serif;
  font-weight:900;
  line-height:1.28;
  letter-spacing:0;
  text-transform:none
}
.label {
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase
}
html[lang=ar] .label {
  letter-spacing:0
}
.wm {
  display:inline-block;
  aspect-ratio:1519/547;
  background:currentColor;
  mask:url('../assets/kinza-logo-en.png') center/contain no-repeat;
  -webkit-mask:url('../assets/kinza-logo-en.png') center/contain no-repeat
}
html[lang=ar] .wm {
  aspect-ratio:1528/648;
  mask-image:url('../assets/kinza-logo-ar.png');
  -webkit-mask-image:url('../assets/kinza-logo-ar.png')
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip-path:inset(50%)
}
.header {
  position:fixed;
  inset:0 0 auto;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 var(--pad);
  z-index:70;
  background:white;
  color:var(--navy);
  border-bottom:1px solid rgba(0,20,137,.15)
}
.header .wm {
  width:104px;
  height:38px
}
.header__center {
  position:absolute;
  left:50%;
  transform:translateX(-50%)
}
.header__actions {
  display:flex;
  gap:28px;
  align-items:center
}
.header__actions>button:first-child {
  font-size:13px;
  font-weight:700;
  min-height:44px
}
.burger {
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  position:relative
}
.burger span {
  position:absolute;
  width:30px;
  height:2px;
  background:currentColor;
  transition:transform .3s
}
.burger span:first-child {
  transform:translateY(-5px)
}
.burger span:last-child {
  transform:translateY(5px)
}
.burger[aria-expanded=true] span:first-child {
  transform:rotate(45deg)
}
.burger[aria-expanded=true] span:last-child {
  transform:rotate(-45deg)
}
.header.is-open {
  background:var(--navy);
  color:white;
  border-color:transparent
}
.menu {
  position:fixed;
  inset:0;
  z-index:60;
  background:var(--navy);
  color:white;
  padding:105px var(--pad) 30px;
  display:grid;
  grid-template-rows:1fr auto;
  visibility:hidden;
  opacity:0;
  transform:translateY(-3%);
  transition:opacity .35s,transform .5s var(--ease),visibility 0s .5s;
  overflow-y:auto
}
.menu.is-open {
  visibility:visible;
  opacity:1;
  transform:none;
  transition-delay:0s
}
html.menu-open {
  overflow:hidden
}
.menu__links {
  display:flex;
  flex-direction:column;
  justify-content:center
}
.menu__links a {
  font-size:clamp(40px,7.5vw,110px);
  padding:10px 0;
  border-bottom:1px solid #ffffff35
}
.menu__links a:hover {
  padding-inline-start:20px
}
.menu__foot {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  padding-top:30px
}
.menu__group {
  display:flex;
  gap:12px
}
.chip {
  padding:13px 20px;
  border:1px solid currentColor;
  font-size:14px
}
.chip--fill {
  color:var(--navy);
  background:white
}
.menu__social {
  display:flex;
  gap:12px
}
.menu__social a {
  padding:10px
}
.menu svg {
  width:24px;
  height:24px
}
.hero {
  height:100svh;
  min-height:700px;
  background:var(--bg);
  color:var(--ink);
  position:relative;
  overflow:clip;
  isolation:isolate;
  transition:background .65s,color .65s;
  padding-top:72px
}
.hero__logo {
  position:absolute;
  top:108px;
  left:3%;
  width:94%;
  height:34svh;
  pointer-events:none
}
.hero__can {
  position:absolute;
  left:50%;
  top:47%;
  width:min(37vw,520px);
  height:75svh;
  object-fit:contain;
  max-width:none;
  transform:translate(-50%,-36%);
  z-index:3;
  filter:drop-shadow(0 20px 12px #0002);
  animation:hero-center 6s ease-in-out infinite
}
.hero__can:first-child {
  z-index:2;
  left:31%;
  top:50%;
  width:min(31vw,440px);
  transform:translate(-50%,-30%) rotate(-24deg);
  animation:hero-left 6s ease-in-out infinite
}
.hero__can:last-child {
  z-index:2;
  left:69%;
  top:50%;
  width:min(31vw,440px);
  transform:translate(-50%,-30%) rotate(24deg);
  animation:hero-right 6s ease-in-out infinite
}
.hero__title {
  position:absolute;
  bottom:60px;
  left:0;
  width:100%;
  font-size:10.4vw;
  text-align:center;
  white-space:nowrap;
  z-index:1
}
.hero__bottom {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5
}
.hero__bottom a {
  display:flex;
  align-items:center;
  gap:25px
}
.hero__bottom a span:last-child {
  font-size:22px
}
.hero__flavor {
  display:flex;
  gap:14px
}
.hero__dots {
  position:absolute;
  right:24px;
  top:50%;
  display:flex;
  flex-direction:column;
  gap:9px;
  z-index:5
}
.hero__dots button {
  width:12px;
  height:12px;
  border:1px solid currentColor;
  background:var(--d);
  transition:transform .3s
}
.hero__dots button[aria-current=true] {
  transform:scale(1.5)
}
.curtain {
  position:absolute;
  inset:0;
  background:var(--navy);
  pointer-events:none;
  z-index:4;
  opacity:0
}
@keyframes hero-center {
  50% {
    transform:translate(-50%,-39%) rotate(4deg)
  }
}
@keyframes hero-left {
  50% {
    transform:translate(-53%,-25%) rotate(-29deg)
  }
}
@keyframes hero-right {
  50% {
    transform:translate(-47%,-35%) rotate(29deg)
  }
}
.strip {
  height:36px;
  display:flex;
  align-items:center;
  overflow:clip;
  direction:ltr;
  background:white;
  color:var(--blue);
  border-block:1px solid #00148920
}
.strip__in {
  display:flex;
  width:max-content;
  gap:0;
  white-space:nowrap;
  animation:ticker 65s linear infinite
}
.strip__in span {
  flex:none;
  padding-inline-end:32px
}
.strip__in span:before {
  content:'*';
  margin-inline-end:32px
}
.strip--rev .strip__in {
  animation-direction:reverse
}
.strip__in [lang=ar] {
  font-family:Cairo,sans-serif
}
@keyframes ticker {
  to {
    transform:translateX(-50%)
  }
}
.photos,.cans,.patterns {
  overflow:hidden;
  direction:ltr;
  touch-action:pan-y;
  cursor:grab;
  user-select:none;
  overscroll-behavior-x:contain
}
.photos__in,.cans__in,.pattern__in {
  display:flex;
  width:max-content;
  will-change:transform
}
.photos img,.cans img,.patterns img {
  -webkit-user-drag:none;
  user-select:none
}
.photos figure {
  height:calc(100svh - 72px);
  min-height:520px;
  aspect-ratio:1600/893;
  flex:none;
  margin-right:var(--gap);
  overflow:clip
}
.photos img {
  height:100%;
  width:100%;
  object-fit:cover
}
.section-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 24px;
  gap:24px;
  background:white;
  color:var(--navy)
}
.section-bar h2 {
  font-size:clamp(28px,3.6vw,60px)
}
.section-bar .label {
  white-space:nowrap
}
.pop {
  height:100svh;
  min-height:650px;
  background:var(--bg);
  color:var(--ink);
  display:grid;
  grid-template-columns:1fr 1fr;
  position:relative;
  overflow:clip;
  transition:background .65s,color .65s
}
.pop__copy {
  padding:32px 0 30px 24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  z-index:2;
  pointer-events:none
}
.pop__word {
  font-size:clamp(70px,11vw,170px);
  max-width:6.5ch;
  overflow-wrap:normal
}
.pop__copy>.label:last-child {
  max-width:240px;
  line-height:1.5
}
.spin {
  position:absolute;
  right:-5%;
  top:0;
  height:100%;
  width:65%
}
.spin>* {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:0;
  transition:opacity .45s;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent),linear-gradient(transparent,#000 12%,#000 88%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent),linear-gradient(transparent,#000 12%,#000 88%,transparent);
  mask-composite:intersect
}
.spin>.is-on {
  opacity:1
}
.spin>img {
  mask:none;
  -webkit-mask:none;
  height:82%;
  top:9%
}
.spin>.spin__film {
  object-fit:cover;
  opacity:1;
  mask:none;
  -webkit-mask:none
}
.pop:has(.spin__film) .pop__copy {
  display:none
}
.pop:has(.spin__film) .spin {
  inset:0;
  width:100%
}
.pop__film {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:3
}
.patterns {
  background:var(--white)
}
.pattern__in figure {
  flex:none;
  height:calc(100svh - 150px);
  margin-right:var(--gap);
  aspect-ratio:900/1370
}
.pattern__in img {
  width:100%;
  height:100%;
  object-fit:contain
}
.cans {
  background:var(--white)
}
.tile {
  flex:none;
  position:relative;
  height:min(84svh,800px);
  aspect-ratio:900 / 1370;
  width:auto;
  overflow:clip;
  isolation:isolate;
  background:var(--grey);
  margin-inline-end:var(--gap);
  transition:background .25s var(--ease);
  text-align:start
}
.tile>img {
  position:absolute;
  width:70%;
  height:64%;
  object-fit:contain;
  inset:0;
  margin:auto;
  z-index:2;
  pointer-events:none
}
.tile__pat {
  position:absolute;
  inset:0;
  z-index:3;
  background:var(--tb);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s var(--ease)
}
.tile__pat img,.tile__pat svg {
  width:100%;
  height:100%;
  object-fit:contain
}
.tile[aria-pressed=true] {
  background:var(--tb)
}
.tile[aria-pressed=true] .tile__pat {
  opacity:.48
}
@media(hover:hover) {
  .tile:hover { background:var(--tb) }
  .tile:hover .tile__pat { opacity:.48 }
}
.is-drag {
  cursor:grabbing
}
.life {
  position:relative;
  background:var(--white)
}
.wall {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--gap);
  height:100svh;
  min-height:520px;
  overflow:clip;
  direction:ltr;
  align-items:start
}
.wall__col {
  will-change:transform
}
.wall figure {
  aspect-ratio:635/790;
  margin-bottom:var(--gap);
  overflow:clip
}
.wall figure:last-child {
  margin:0
}
.wall img {
  height:100%;
  width:100%;
  object-fit:cover
}
.rv {
  opacity:1
}
.footer {
  background:var(--navy);
  color:white;
  padding:56px clamp(24px,4vw,64px) 0
}
.footer__grid {
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);
  gap:clamp(48px,8vw,128px)
}
.footer h3 {
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  margin-bottom:24px;
  opacity:.7
}
.footer ul {
  list-style:none
}
#footLinks { display:grid; gap:24px; justify-items:start }
.footer__aside { display:flex; flex-direction:column; align-items:flex-start }
.footer li a {
  font-family:Anton,sans-serif;
  display:block;
  font-size:clamp(30px,4.5vw,70px);
  line-height:1.15;
  text-transform:uppercase;
  padding-bottom:0
}
.footer li a:hover {
  opacity:.65
}
.footer li button {
  padding:10px 0;
  font-size:16px
}
.footer li button[aria-current=true] {
  text-decoration:underline;
  text-underline-offset:5px
}
.footer__social {
  display:flex;
  gap:4px;
  margin-top:auto;
  padding-top:32px
}
.footer__social a {
  height:44px;
  width:44px;
  display:grid;
  place-items:center
}
.footer__social svg {
  width:21px;
  height:21px
}
.footer__bottom {
  margin-top:48px;
  border-top:1px solid #ffffff40;
  padding:22px 0;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  gap:20px
}
.footer__bottom .wm {
  width:40px;
  height:16px;
  flex:none
}
.footer__copyright {
  display:inline-flex;
  align-items:center;
  gap:5px;
  line-height:16px
}
.footer__back {
  display:block;
  font-size:14px;
  margin-top:26px
}
html[lang=ar] .hero__title {
  font-size:10vw
}
html[lang=ar] .pop__copy {
  padding:30px 24px 30px 0
}
html[lang=ar] .pop__word {
  font-size:9vw;
  max-width:6ch
}
html[lang=ar] .spin {
  right:auto;
  left:-5%
}
html[lang=ar] .footer li a {
  font-family:Cairo,sans-serif;
  font-weight:900;
  line-height:1.28
}
@media(max-width:900px) {
  .header__center {
    display:none
  }
  .hero__logo {
    height:28svh
  }
  .hero__can {
    width:50vw
  }
  .hero__can:first-child,.hero__can:last-child {
    width:44vw
  }
  .hero__can:first-child {
    left:24%
  }
  .hero__can:last-child {
    left:76%
  }
  .hero__title {
    bottom:90px
  }
  .hero__dots {
    top:auto;
    bottom:72px;
    right:50%;
    transform:translateX(50%);
    flex-direction:row
  }
  .pop__word {
    font-size:12vw
  }
  .menu__foot {
    flex-wrap:wrap
  }
}
@media(max-width:656px) {
  :root {
    --pad:16px
  }
  html {
    scroll-padding-top:64px
  }
  .header {
    height:64px;
    padding-inline:16px
  }
  .header .wm {
    width:86px;
    height:32px
  }
  .header__actions {
    gap:18px
  }
  .hero {
    min-height:620px;
    max-height:920px;
    padding-top:64px
  }
  .hero__logo {
    top:96px;
    height:23svh;
    left:4%;
    width:92%
  }
  .hero__can {
    width:70vw;
    height:65svh;
    top:40%;
    transform:translate(-50%,-20%)
  }
  .hero__can:first-child,.hero__can:last-child {
    width:56vw;
    height:56svh;
    top:46%
  }
  .hero__can:first-child {
    left:18%
  }
  .hero__can:last-child {
    left:82%
  }
  .hero__title {
    font-size:10.1vw;
    bottom:110px
  }
  .hero__bottom {
    padding:18px 16px;
    align-items:end
  }
  .hero__bottom .label {
    font-size:10px;
    letter-spacing:.05em
  }
  .hero__flavor {
    flex-direction:column;
    gap:4px
  }
  .hero__bottom a {
    gap:14px
  }
  .hero__dots {
    bottom:78px;
    gap:11px
  }
  .hero__dots button {
    height:11px;
    width:11px
  }
  .photos figure {
    height:auto;
    width:100vw;
    min-height:0;
    aspect-ratio:1600/893
  }
  .section-bar {
    padding:20px 16px;
    align-items:start;
    gap:12px
  }
  .section-bar h2 {
    font-size:30px;
    max-width:9ch
  }
  .section-bar .label {
    font-size:10px;
    max-width:110px;
    white-space:normal;
    text-align:end;
    line-height:1.6
  }
  .pop {
    height:680px;
    min-height:0;
    display:block
  }
  .pop__copy {
    padding:24px 16px;
    height:100%
  }
  .pop__word {
    font-size:22vw;
    max-width:6.5ch;
    margin-top:-180px
  }
  .pop__copy>.label:last-child {
    max-width:150px;
    font-size:10px
  }
  .spin {
    height:70%;
    width:85%;
    top:auto;
    bottom:-3%;
    right:-18%
  }
  .pattern__in figure {
    height:490px
  }
  .tile {
    height:440px
  }
  .wall {
    height:700px;
    min-height:0
  }
  .footer {
    padding:30px 16px 0
  }
  .footer__grid {
    grid-template-columns:1fr;
    gap:32px
  }
  .footer li a {
    font-size:8vw
  }
  .footer h3 {
    margin-bottom:16px
  }
  .footer__social {
    gap:4px;
    justify-content:flex-start;
    margin:0;
    padding-top:24px
  }
  .footer__bottom {
    flex-direction:column;
    gap:12px
  }
  #footLang {
    display:flex;
    gap:28px
  }
  .menu {
    padding:94px 16px 24px
  }
  .menu__links a {
    font-size:10vw;
    padding:16px 0
  }
  .menu__foot {
    gap:20px
  }
  .menu__social {
    gap:6px
  }
  .menu__social a {
    padding:8px
  }
  .chip {
    font-size:13px;
    padding:12px 14px
  }
  html[lang=ar] .hero__logo {
    height:26svh;
    top:84px
  }
  html[lang=ar] .hero__title {
    font-size:11vw;
    bottom:112px
  }
  html[lang=ar] .pop__word {
    font-size:20vw;
    max-width:6ch;
    margin-top:-160px
  }
  html[lang=ar] .spin {
    right:auto;
    left:-18%
  }
  html[lang=ar] .pop__copy {
    padding:24px 16px
  }
  html[lang=ar] .section-bar h2 {
    font-size:25px
  }
  html[lang=ar] .footer li a {
    font-size:6.6vw
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    animation:none!important;
    transition:none!important
  }
  html {
    scroll-behavior:auto
  }
  .photos,.cans,.patterns,.strip {
    overflow-x:auto;
    touch-action:auto
  }
  .wall {
    height:auto;
    min-height:0
  }

     each end. Browser animations keep fractional motion off the scroll pipeline. */
  const galleryEase = 'cubic-bezier(.2, 0, .05, 1)';
  function observeGallery(viewport, change) {
    let observer;
    const observe = () => {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver(es => change(es[0].isIntersecting), {
        rootMargin: `${viewport.clientHeight / 3}px 0px`
      });
      observer.observe(viewport);
    };
    new ResizeObserver(observe).observe(viewport);
    observe();
  }
  function galleryMotion(viewport, track, count) {
    let animation, timer, deadline = 0, visible = false, pressing = false, keyboard = false;
    let position = 0, direction = 1, dragged = false, inertia = 0;
    const limit = () => Math.max(0, track.offsetWidth - viewport.clientWidth);
    const clamp = x => Math.max(0, Math.min(limit(), x));
    const draw = () => { track.style.transform = `translate3d(${-position}px,0,0)`; };
    function schedule(ms) {
      clearTimeout(timer); deadline = performance.now() + ms;
      timer = setTimeout(() => { deadline = 0; run(); }, ms);
    }
    function stop() {
      clearTimeout(timer); deadline = 0;
      if (animation) {
        position = -new DOMMatrixReadOnly(getComputedStyle(track).transform).m41;
        animation.cancel(); animation = null; draw();
      }
      cancelAnimationFrame(inertia);
    }
    function run() {
      if (reduced || !visible || document.hidden || pressing || keyboard || animation || !limit()) return;
      clearTimeout(timer);
      track.classList.remove('is-held');
      const end = direction > 0 ? limit() : 0;
      if (Math.abs(end-position) < 5) {
        position = end; draw(); direction *= -1; schedule(1000); return;
      }
      const duration = Math.max(1300, count * 4400 / 13 * Math.abs(end-position) / limit());
      animation = track.animate([
        { transform: `translate3d(${-position}px,0,0)` },
        { transform: `translate3d(${-end}px,0,0)` }
      ], { duration, easing: galleryEase, fill: 'forwards' });
      animation.onfinish = () => {
        position = end; animation.cancel(); animation = null; draw(); run();
      };
    }
    function hold(ms = 1000) {
      stop(); track.classList.add('is-held');
      if (ms) schedule(ms);
    }
    function reset() { stop(); position = clamp(position); draw(); run(); }
    observeGallery(viewport, active => {
      visible = active;
      if (active) {
        track.querySelectorAll('img').forEach(img => { img.loading = 'eager'; });
        run();
      } else stop();
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : run());
    new ResizeObserver(reset).observe(viewport);
    viewport.addEventListener('pointerdown', e => {
      if (reduced || !e.isPrimary || e.button !== 0) return;
      const remaining = Math.max(0, deadline-performance.now());
      clearTimeout(timer); deadline = 0; cancelAnimationFrame(inertia);
      if (animation) {
        const time = animation.currentTime ?? 0;
        animation.pause(); animation.currentTime = time;
        position = -new DOMMatrixReadOnly(getComputedStyle(track).transform).m41;
      }
      pressing = true; dragged = false; keyboard = false;
      const startX = e.clientX, startY = e.clientY, start = position;
      let lastX = startX, lastTime = performance.now(), velocity = 0;
      const move = ev => {
        if (ev.pointerId !== e.pointerId) return;
        const dx = ev.clientX-startX, dy = ev.clientY-startY;
        if (!dragged && Math.abs(dx) <= Math.max(5, Math.abs(dy))) return;
        if (!dragged) stop();
        dragged = true; viewport.classList.add('is-drag');
        const now = performance.now();
        velocity = Math.max(-3, Math.min(3, (lastX-ev.clientX) / Math.max(1, now-lastTime)));
        lastX = ev.clientX; lastTime = now;
        position = clamp(start-dx); direction = dx < 0 ? 1 : -1; draw();
      };
      const end = ev => {
        if (ev.pointerId !== e.pointerId) return;
        pressing = false; viewport.classList.remove('is-drag');
        removeEventListener('pointermove', move); removeEventListener('pointerup', end); removeEventListener('pointercancel', end);
        if (!dragged) {
          track.classList.remove('is-held');
          if (visible && !document.hidden && !keyboard) {
            if (animation) animation.play();
            else if (remaining) schedule(remaining);
            else run();
          }
          return;
        }
        if (ev.type === 'pointercancel' || performance.now()-lastTime > 100) velocity = 0;
        let time = performance.now();
        const coast = now => {
          const dt = Math.min(32, now-time); time = now;
          const next = clamp(position + velocity*dt);
          velocity *= Math.exp(-dt/240);
          if (Math.abs(next-position) < .1 || Math.abs(velocity) < .02) { hold(1000); return; }
          position = next; draw(); inertia = requestAnimationFrame(coast);
        };
        inertia = requestAnimationFrame(coast);
        setTimeout(() => { dragged = false; }, 0);
      };
      addEventListener('pointermove', move); addEventListener('pointerup', end); addEventListener('pointercancel', end);
    });
    viewport.addEventListener('wheel', e => {
      const delta = e.deltaX || (e.shiftKey ? e.deltaY : 0);
      if (reduced || !delta) return;
      e.preventDefault(); hold(); position = clamp(position + delta); direction = delta > 0 ? 1 : -1; draw();
    }, { passive: false });
    // Only keyboard focus holds a row. Mouse hover and mouse focus never do.
    viewport.addEventListener('focusin', e => {
      if (reduced || !e.target.matches(':focus-visible')) return;
      keyboard = true; hold(0);
      const tile = e.target.closest('.tile');
      if (tile) { position = clamp(tile.offsetLeft); draw(); }
    });
    viewport.addEventListener('focusout', e => {
      if (!viewport.contains(e.relatedTarget)) { keyboard = false; hold(); }
    });
    // Absorb browser scrolling used to reveal focused buttons into the transform.
    viewport.addEventListener('scroll', () => {
      if (reduced || !viewport.scrollLeft) return;
      stop(); position = clamp(position + viewport.scrollLeft); viewport.scrollLeft = 0; draw(); run();
    });
    return { hold, reset, wasDragged: () => dragged };
  }
  const productViewport = document.getElementById('products'), productTrack = document.getElementById('productsIn');
  galleryMotion(productViewport, productTrack, PRODUCTS.length);

  const tiles = document.getElementById('tiles'), cans = tiles.parentElement;
  const on = new Set();
  const canMotion = galleryMotion(cans, tiles, FL.length);
  function buildTiles() {
    tiles.innerHTML = FL.map(([id, bg, ink]) => `<button type="button" class="tile" data-id="${id}" aria-pressed="${on.has(id)}" style="--tb:${bg};--tc:${ink}" aria-label="${esc(T['f_' + id][lang])}"><div class="tile__pat" aria-hidden="true">${bigPattern(id)}</div><img src="../assets/can360/${id}-${lang === 'ar' ? 'ar' : 'en'}.webp" alt="" loading="lazy" draggable="false" /></button>`).join('');
    canMotion.reset();
  }
  tiles.addEventListener('click', e => {
    const b = e.target.closest('.tile'); if (!b || canMotion.wasDragged()) return;
    const id = b.dataset.id; on.has(id) ? on.delete(id) : on.add(id);
    b.setAttribute('aria-pressed', String(on.has(id)));
  });

  (function peopleMotion() {
    const wall = document.getElementById('lifeIn'), phone = matchMedia('(max-width: 656px)');
    let animations = [], timer, visible = false, forward = true, progress = 0;
    function stop() {
      clearTimeout(timer);
      const first = wall.firstElementChild, distance = first ? Math.max(0, first.offsetHeight-wall.clientHeight) : 0;
      if (distance) progress = Math.max(0, Math.min(1, -new DOMMatrixReadOnly(getComputedStyle(first).transform).m42 / distance));
      animations.forEach(a => a.cancel()); animations = [];
      draw();
    }
    function draw() {
      [...wall.children].forEach((col, i) => {
        const distance = Math.max(0, col.offsetHeight-wall.clientHeight);
        col.style.transform = `translate3d(0,${-distance*(i === 1 ? 1-progress : progress)}px,0)`;
      });
    }
    function run() {
      if (reduced || !visible || document.hidden || animations.length) return;
      clearTimeout(timer);
      const cols = [...wall.children], distance = Math.max(0, cols[0].offsetHeight-wall.clientHeight);
      if (!distance) return;
      const target = forward ? 1 : 0;
      if (Math.abs(target-progress)*distance < 5) { forward = !forward; timer = setTimeout(run, 1000); return; }
      const fullDuration = Math.max(2800, Math.max(...cols.map(c => c.children.length))*2700/7);
      const duration = Math.max(1000, fullDuration*Math.abs(target-progress));
      animations = cols.map((col, i) => {
        const travel = Math.max(0, col.offsetHeight-wall.clientHeight);
        return col.animate([
          { transform: `translate3d(0,${-travel*(i === 1 ? 1-progress : progress)}px,0)` },
          { transform: `translate3d(0,${-travel*(i === 1 ? 1-target : target)}px,0)` }
        ], { duration, easing: galleryEase, fill: 'forwards' });
      });
      animations[0].onfinish = () => {
        progress = target; animations.forEach(a => a.cancel()); animations = []; draw(); run();
      };
    }
    function build() {
      stop();
      const count = phone.matches ? 2 : 3;
      wall.style.gridTemplateColumns = `repeat(${count}, minmax(0, 1fr))`;
      wall.innerHTML = Array.from({ length: count }, (_, c) => `<div class="wall__col">${LIFE.filter((_, i) => i % count === c).map(fig).join('')}</div>`).join('');
      draw(); run();
    }
    build(); phone.addEventListener('change', build);
    new ResizeObserver(() => { stop(); draw(); run(); }).observe(wall);
    observeGallery(wall, active => {
      visible = active;
      if (active) { wall.querySelectorAll('img').forEach(img => { img.loading = 'eager'; }); run(); }
      else stop();
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : run());
  })();

  /* ---------- footer, language ---------- */
  document.getElementById('footLinks').innerHTML = CARDS.map(([href, k]) => `<li><a href="${href}" target="_blank" rel="noopener" data-i18n="${k}">${T[k].en}</a></li>`).join('');
  document.getElementById('footSocial').innerHTML = SOCIAL.map(([href, k, d]) => `<a href="${href}" target="_blank" rel="noopener" aria-label="${T[k].en}">${ico(d)}</a>`).join('');
  function applyLang(next) {
    lang = next;
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { const t = T[el.dataset.i18n]; if (t) el.textContent = t[lang]; });
    document.getElementById('menuBtn').setAttribute('aria-label', T.menu[lang]);
    document.querySelectorAll('[data-i18n-label]').forEach(el => el.setAttribute('aria-label', T[el.dataset.i18nLabel][lang]));
    document.querySelectorAll('#footLang button').forEach(b => b.setAttribute('aria-current', String(b.dataset.l === lang)));
    document.getElementById('statement').textContent = T.say[lang];
    buildStrips(); buildTiles();
    document.querySelectorAll('#menuSocial a,#footSocial a').forEach((a,i)=>a.setAttribute('aria-label',T[SOCIAL[i%SOCIAL.length][1]][lang]));
    try { localStorage.setItem('kinza-lang', lang); } catch (_) {}
  }
  (function () {
    const q = new URLSearchParams(location.search).get('lang');
    let saved = null; try { saved = localStorage.getItem('kinza-lang'); } catch (_) {}
    applyLang(q === 'ar' || q === 'en' ? q : (saved === 'ar' ? 'ar' : 'en'));
    document.getElementById('headerLang').addEventListener('click', () => applyLang(lang === 'ar' ? 'en' : 'ar'));
    document.getElementById('langBtn').addEventListener('click', () => applyLang(lang === 'ar' ? 'en' : 'ar'));
    document.getElementById('footLang').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.l !== lang) applyLang(b.dataset.l); });
    watch();
  })();

</script>
</body></html>
